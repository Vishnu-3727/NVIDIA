[project]
name = "visual-slam"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "numpy<2",
    "scipy",
    "matplotlib",
    "opencv-python-headless",
    "nvtx",
    "psutil",
    "torch>=2.12.0",
    "torchvision>=0.26.0",
]

[project.scripts]
slam-benchmark        = "benchmarks.slam.slam_benchmark:main"
ate-rpe-benchmark     = "benchmarks.trajectory.ate_rpe_benchmark:main"
integration-benchmark = "benchmarks.cuvslam.integration_benchmark:main"
roofline-benchmark    = "benchmarks.roofline.roofline_benchmark:main"
pipeline-benchmark    = "benchmarks.pipeline.pipeline_handoff_benchmark:main"

# cu128 first — matches Perlmutter A100 CUDA 12.8
# cu126 fallback — matches dev RTX 4060 CUDA 12.6
[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"
